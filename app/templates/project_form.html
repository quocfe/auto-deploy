{% extends "base.html" %}{% block content %}<h1>{% if project %}Edit Project{% else %}New Project{% endif %}</h1>{% if error %}<p class="error">{{ error }}</p>{% endif %}<form method="post" class="form-grid"><label>Name<input name="name" value="{{ project.name if project else '' }}" required></label><label>Slug<input name="slug" value="{{ project.slug if project else '' }}" required pattern="[a-z0-9]+(-[a-z0-9]+)*"></label><label>Repository URL<input name="repository_url" value="{{ project.repository_url if project else '' }}" required></label><label>Provider<input name="provider" value="{{ project.provider if project else 'github' }}" required></label><button>{% if project %}Save Project{% else %}Create Project{% endif %}</button></form>{% endblock %}
