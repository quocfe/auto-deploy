{% extends "base.html" %}{% block content %}<h1>{% if environment %}Edit Environment{% else %}New Environment{% endif %}</h1>{% if error %}<p class="error">{{ error }}</p>{% endif %}<form method="post" class="form-grid"><label>Name<input name="name" value="{{ environment.name if environment else '' }}" required></label><label>Branch<input name="branch" value="{{ environment.branch if environment else '' }}" required></label><label>Container name<input name="container_name" value="{{ environment.container_name if environment else '' }}" required></label><label>Container port<input name="container_port" type="number" min="1" max="65535" value="{{ environment.container_port if environment else 8000 }}" required></label><label>Dockerfile<input name="dockerfile" value="{{ environment.dockerfile if environment else 'Dockerfile' }}" required></label><label>Build context<input name="build_context" value="{{ environment.build_context if environment else '.' }}" required></label><label>Docker network<input name="docker_network" value="{{ environment.docker_network if environment else 'web_network' }}" required></label><label>Domain<input name="domain" value="{{ environment.domain if environment and environment.domain else '' }}"></label><label class="check"><input name="auto_deploy" type="checkbox" {% if environment and environment.auto_deploy %}checked{% endif %}> Auto deploy</label><label class="check"><input name="enabled" type="checkbox" {% if not environment or environment.enabled %}checked{% endif %}> Enabled</label><button>{% if environment %}Save Environment{% else %}Create Environment{% endif %}</button></form>{% endblock %}
